name: Cross-platform

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron không tự mang theo NSS và ALSA. Trên một Ubuntu sạch nó chết
      # ngay với "libnspr4.so: cannot open shared object file" trước khi chạy
      # được dòng test nào. Tên gói ALSA đổi giữa 22.04 và 24.04 nên thử cả hai.
      - name: Install Electron runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
      # Ubuntu 24.04 khoá user namespace không đặc quyền bằng AppArmor, làm sandbox
      # của Chromium không dựng được. Ứng dụng chạy renderer với sandbox: true nên
      # nới đúng cái khoá đó ở CI thay vì tắt sandbox — tắt sandbox là kiểm thử
      # một cấu hình khác với cấu hình phát hành.
      - name: Allow unprivileged user namespaces (Ubuntu 24.04)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: npm test
      - name: Test on Ubuntu with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run build:win
            artifact: windows
          - os: ubuntu-22.04
            command: npm run build:linux
            artifact: ubuntu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-manager-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
